name: Automated End-of-Day Caretaker Health Report

on:
  schedule:
    - cron: '0 20 * * *' # Every night at 8:00 PM UTC
  workflow_dispatch:

jobs:
  send-daily-digest:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Caretaker Daily Digest Notification
        run: |
          echo "Running scheduled CarePulse End-of-Day Health Summary..."
          echo "Triggering API digest worker..."
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_RESEND_API_KEY: ${{ secrets.VITE_RESEND_API_KEY }}
